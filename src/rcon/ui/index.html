<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ark-rcon</title>
<style>
:root {
  --bg: #0d1017; --panel: #151a24; --panel2: #1c2230; --line: #2a3242; --text: #e6e4dc; --muted: #a7adba;
  --gold: #c9a24a; --gold-hi: #ecd07f; --gold-lo: #7a5f22; --ok: #5fb878; --warn: #e0a33b; --bad: #e0605a; --link: #f0c96a;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: linear-gradient(#1c2436, #121722); border-bottom: 1px solid var(--gold-lo); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font: 700 20px var(--serif); color: var(--gold-hi); margin: 0; text-shadow: 0 1px 2px #000; letter-spacing: .02em; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { padding: 6px 10px; border-radius: 4px; color: var(--muted); font-family: var(--serif); font-weight: 700; }
nav a.active { color: var(--bg); background: linear-gradient(var(--gold-hi), var(--gold)); text-decoration: none; }
#who { margin-left: auto; color: var(--muted); font-size: 13px; }
main { padding: 16px; max-width: 1700px; margin: 0 auto; }
h2 { font: 700 18px var(--serif); color: var(--gold-hi); margin: 0 0 12px; }
h3 { font: 700 15px var(--serif); color: var(--gold); margin: 14px 0 6px; }
.eyebrow { font: 700 11px var(--serif); color: var(--gold); letter-spacing: .22em; text-transform: uppercase; }
button, .btn { font: 700 13px var(--serif); color: #1b1408; background: linear-gradient(var(--gold-hi), var(--gold)); border: 1px solid var(--gold-lo); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
button.ghost { background: var(--panel2); color: var(--text); border-color: var(--line); }
button.danger { background: linear-gradient(#f08a84, var(--bad)); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--text); background: #0a0d13; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
textarea { font-family: var(--mono); font-size: 12px; width: 100%; min-height: 110px; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.grow { flex: 1; min-width: 160px; }
.bar { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 330px; overflow: hidden; }
.card .head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--panel2); border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
.card .head b { font-family: var(--serif); color: var(--gold-hi); }
.card .body { display: flex; flex: 1; min-height: 0; }
.card .players { width: 165px; border-right: 1px solid var(--line); overflow: auto; padding: 6px; font-size: 13px; }
.card .feed { flex: 1; overflow: auto; padding: 4px 8px; font-size: 12.5px; max-height: 300px; }
.card .cmd { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); }
.card .cmd input { flex: 1; font-family: var(--mono); font-size: 12px; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); }
.dot.online { background: var(--ok); } .dot.offline, .dot.auth-failed { background: var(--bad); } .dot.starting { background: var(--warn); }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.live { border-color: var(--gold-lo); color: var(--gold); } .badge.test { color: #8fc1ff; border-color: #2d4a6b; }
.badge.bad { color: var(--bad); border-color: #6b2d2d; } .badge.ok { color: var(--ok); border-color: #2d6b3d; }
.ev { padding: 2px 0; border-bottom: 1px solid #1d2330; word-break: break-word; white-space: pre-wrap; }
.ev time { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-right: 6px; }
.ev.chat .t { color: #fff; } .ev.join .t, .ev.leave .t { color: #8fc1ff; } .ev.admin .t { color: var(--warn); }
.ev.server-chat .t { color: var(--gold-hi); } .ev.ban-kick .t, .ev.map-offline .t { color: var(--bad); } .ev.map-online .t { color: var(--ok); }
.ev.tribe .t, .ev.tame .t, .ev.death .t, .ev.mod .t, .ev.other .t { color: var(--muted); }
.ev .n { color: var(--link); font-weight: 600; }
.console-out { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 700 12px var(--serif); color: var(--gold); padding: 6px; border-bottom: 1px solid var(--gold-lo); position: sticky; top: 0; background: var(--panel); }
td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:hover td { background: #171d29; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
.err { color: var(--bad); }
.okc { color: var(--ok); }
.tablewrap { overflow-x: auto; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--gold-lo); border-radius: 8px; width: min(1000px, 96vw); max-height: 90vh; padding: 16px; }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.scroll { max-height: 320px; overflow: auto; }
#login { max-width: 360px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--gold-lo); border-radius: 8px; padding: 24px; box-shadow: 0 0 0 3px #2a2113, 0 0 0 4px var(--gold-lo); }
#login input { width: 100%; margin-bottom: 10px; }
#toast { position: fixed; bottom: 16px; right: 16px; background: var(--panel2); border: 1px solid var(--gold-lo); border-radius: 6px; padding: 10px 14px; display: none; max-width: 480px; z-index: 20; white-space: pre-wrap; }
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; } .cols { grid-template-columns: 1fr; }
  .card .players { width: 110px; } main { padding: 10px 16px; } #who { margin-left: 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
const S = { me: null, maps: [], meta: null, view: 'dashboard', feeds: {}, es: null };
const EV_LABEL = { 'server-chat': 'Server', join: 'Join', leave: 'Leave', admin: 'Admin', tribe: 'Stamm', tame: 'Zähmung', death: 'Tod', mod: 'Mod', 'map-online': 'online', 'map-offline': 'offline', 'ban-kick': 'Bann-Kick' };

// --- helpers --------------------------------------------------------------------------------------------------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'selected') el[k] = Boolean(v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(3)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const $ = (sel) => document.querySelector(sel);
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(3).filter((k) => k !== null && k !== undefined && k !== false).map((k) => (k instanceof Node ? k : String(k))));
const can = (p) => S.me && S.me.permissions.includes(p);
const fmt = (ts) => ts ? new Date(ts).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
const fmtT = (ts) => new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const dur = (s) => { s = Math.round(s || 0); const hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return hh ? `${hh} h ${m} min` : `${m} min`; };
function toast(text, bad) { const t = $('#toast'); t.textContent = text; t.style.borderColor = bad ? 'var(--bad)' : 'var(--gold-lo)'; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, bad ? 9000 : 4000); }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-ark-rcon': '1' }, body: body === undefined ? undefined : JSON.stringify(body), credentials: 'same-origin' });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login' && path !== '/api/me') { S.me = null; render(); }
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}
const safe = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const resultText = (results) => results.map((r) => `${r.map}: ${r.ok ? (r.response || '(keine Antwort)') : r.error}`).join('\n');
function evLine(e, withMap) {
  const name = e.name ? h('a', { class: 'n', onclick: () => e.steam_id && openPlayer(e.steam_id), title: e.steam_id || '' }, e.name) : null;
  let character = '';
  try { character = e.data ? (JSON.parse(e.data).character || '') : ''; } catch { /* ignore */ }
  return h('div', { class: `ev ${e.type}` }, h('time', { title: new Date(e.ts).toLocaleString('de-DE') }, fmtT(e.ts)), withMap && e.map ? [h('span', { class: 'badge' }, e.map), ' '] : null,
    e.type === 'chat' ? [name, character ? h('span', { class: 'muted' }, ` (${character})`) : null, ': ', h('span', { class: 't' }, e.text)]
      : h('span', { class: 't' }, `${EV_LABEL[e.type] ? `[${EV_LABEL[e.type]}] ` : ''}${e.text || ''}`));
}

// --- login and frame --------------------------------------------------------------------------------------------
function loginView() {
  const name = h('input', { placeholder: 'Name', autocomplete: 'username' });
  const pw = h('input', { placeholder: 'Passwort', type: 'password', autocomplete: 'current-password' });
  const err = h('div', { class: 'err' });
  const go = async (ev) => {
    ev.preventDefault();
    try { await api('POST', '/api/login', { name: name.value, password: pw.value }); await boot(); } catch (e) { err.textContent = e.message; }
  };
  return h('form', { id: 'login', onsubmit: go }, h('div', { class: 'eyebrow' }, 'RCON-Verwaltung'), h('h2', {}, 'ark-rcon'), name, pw, h('button', { type: 'submit' }, 'Anmelden'), err);
}

const VIEWS = [
  ['dashboard', 'Dashboard', 'view'], ['players', 'Spieler', 'view'], ['activity', 'Aktivität', 'view'], ['bans', 'Banns', 'view'],
  ['commands', 'Befehle', 'view'], ['schedules', 'Zeitpläne', 'view'], ['triggers', 'Trigger', 'view'], ['audit', 'Audit-Log', 'audit'], ['users', 'Benutzer', 'users'],
];

function render() {
  const app = $('#app');
  app.replaceChildren();
  if (!S.me) { app.append(loginView()); return; }
  const nav = h('nav', {}, VIEWS.filter(([, , p]) => can(p)).map(([id, label]) => h('a', { class: S.view === id ? 'active' : '', onclick: () => { S.view = id; location.hash = id; render(); } }, label)));
  app.append(h('header', {}, h('h1', {}, 'ark-rcon'), nav, h('div', { id: 'who' }, `${S.me.name} · ${S.me.role} · `,
    h('a', { onclick: changePassword }, 'Passwort'), ' · ', h('a', { onclick: safe(async () => { await api('POST', '/api/logout'); S.me = null; if (S.es) S.es.close(); render(); }) }, 'Abmelden'))));
  const main = h('main');
  app.append(main);
  ({ dashboard, players, activity, bans, commands, schedules, triggers, audit, users })[S.view](main);
}

// --- dashboard ------------------------------------------------------------------------------------------------
function dashboard(main) {
  const text = h('input', { class: 'grow', placeholder: 'Nachricht an alle Karten (ServerChat; Umlaute werden umgeschrieben)', maxlength: 400 });
  const cmd = h('input', { class: 'grow mono', placeholder: 'Befehl an alle Karten, z. B. SaveWorld', list: 'cmdlist' });
  const out = h('div', { class: 'console-out' });
  const list = h('datalist', { id: 'cmdlist' }, (S.meta?.verified || []).concat(S.meta?.risky || []).map((c) => h('option', { value: c })));
  const sendAll = safe(async () => { if (!text.value.trim()) return; out.textContent = resultText(await api('POST', '/api/broadcast', { maps: 'all', text: text.value })); text.value = ''; });
  const execAll = safe(async () => { if (!cmd.value.trim()) return; if (!confirm(`„${cmd.value}“ an alle Karten senden?`)) return; out.textContent = resultText(await api('POST', '/api/exec', { maps: 'all', command: cmd.value })); });
  text.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAll(); });
  const online = S.maps.reduce((n, m) => n + m.players.length, 0);
  main.append(h('div', { class: 'bar' },
    h('div', { class: 'row' }, h('span', { class: 'eyebrow' }, `${S.maps.filter((m) => m.status === 'online').length} von ${S.maps.length} Karten online · ${online} Spieler`)),
    can('chat') ? h('div', { class: 'row' }, h('span', { class: 'eyebrow' }, 'An alle'), text, h('button', { onclick: sendAll }, 'Senden')) : null,
    can('console') ? h('div', { class: 'row' }, h('span', { class: 'eyebrow' }, 'Konsole'), cmd, list, h('button', { onclick: execAll }, 'An alle Karten')) : null,
    out));
  const grid = h('div', { class: 'grid' });
  main.append(grid);
  for (const m of S.maps) grid.append(mapCard(m));
}

function cardHead(m) {
  return h('div', { class: 'head' }, h('span', { class: `dot ${m.status}`, title: m.error || m.status }), h('b', { title: m.title }, m.name),
    h('span', { class: 'muted' }, `${m.players.length} online`), h('span', { class: `badge ${m.role}` }, m.role),
    m.externalBufferReader ? h('span', { class: 'badge', title: 'Ein anderes Programm (BattleMetrics) liest GetChat/GetGameLog. Der Dienst fragt sie hier nie ab.' }, 'Puffer extern') : null,
    h('span', { class: 'badge', title: 'Quelle für Chat und Spiellog' }, `Log: ${m.logSource}`), m.status !== 'online' && m.error ? h('span', { class: 'err', style: 'font-size:12px' }, m.error) : null);
}
function cardPlayers(m) {
  return h('div', { class: 'players' }, m.players.length ? m.players.map((p) => h('div', {}, h('a', { onclick: () => openPlayer(p.steamId), title: `online seit ${fmt(p.since)}` }, p.name))) : h('div', { class: 'muted' }, 'Keine Spieler'));
}
function mapCard(m) {
  const feed = h('div', { class: 'feed' });
  for (const e of (S.feeds[m.name] || []).slice(-80)) feed.append(evLine(e));
  setTimeout(() => { feed.scrollTop = feed.scrollHeight; });
  const input = h('input', { placeholder: can('console') ? 'Befehl, oder !Text für ServerChat' : '!Text für ServerChat', list: 'cmdlist' });
  const send = safe(async () => {
    const v = input.value.trim(); if (!v) return;
    input.value = '';
    const r = v.startsWith('!') ? await api('POST', '/api/broadcast', { maps: [m.name], text: v.slice(1) }) : await api('POST', '/api/exec', { maps: [m.name], command: v });
    feed.append(h('div', { class: 'ev' }, h('time', {}, fmtT(Date.now())), h('span', { class: r[0]?.ok ? 'okc' : 'err' }, `> ${v}\n${resultText(r)}`)));
    feed.scrollTop = feed.scrollHeight;
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  return h('div', { class: 'card', 'data-map': m.name }, cardHead(m), h('div', { class: 'body' }, cardPlayers(m), feed),
    (can('chat') || can('console')) ? h('div', { class: 'cmd' }, input, h('button', { onclick: send }, 'Senden')) : null);
}

// --- players ---------------------------------------------------------------------------------------------------
function players(main) {
  const q = h('input', { class: 'grow', placeholder: 'Name, Charaktername, SteamID oder ARK-ID', value: S.playerQuery || '' });
  const tbody = h('tbody');
  const load = safe(async () => {
    S.playerQuery = q.value;
    const rows = await api('GET', `/api/players?q=${encodeURIComponent(q.value)}&limit=200`);
    tbody.replaceChildren(...rows.map((p) => h('tr', {},
      h('td', {}, h('a', { onclick: () => openPlayer(p.steam_id) }, p.name || '?'), p.character_name ? h('div', { class: 'muted' }, p.character_name) : null),
      h('td', { class: 'mono' }, p.steam_id), h('td', { class: 'mono' }, p.player_id || ''),
      h('td', {}, p.online.length ? h('span', { class: 'badge ok' }, `online: ${p.online.join(', ')}`) : fmt(p.last_seen)),
      h('td', {}, p.last_map || ''), h('td', {}, dur(p.play_seconds)), h('td', {}, p.sessions), h('td', {}, fmt(p.first_seen)),
      h('td', {}, p.banned ? h('span', { class: 'badge bad' }, 'gebannt') : ''))));
  });
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  main.append(h('h2', {}, 'Spieler'), h('div', { class: 'row' }, q, h('button', { onclick: load }, 'Suchen')),
    h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, h('tr', {}, ['Name', 'SteamID', 'ARK-ID', 'Zuletzt', 'Karte', 'Spielzeit', 'Sitzungen', 'Erstmals', ''].map((t) => h('th', {}, t)))), tbody)));
  load();
}

const openPlayer = safe(async (steamId) => {
  const d = await api('GET', `/api/players/${steamId}`);
  const p = d.player;
  const dlg = $('#dlg');
  const msg = h('input', { class: 'grow', placeholder: 'Private Nachricht (ServerChatTo)' });
  const note = h('input', { class: 'grow', placeholder: 'Notiz' });
  const flag = h('select', {}, ['', 'beobachten', 'verwarnt', 'vertrauenswürdig', 'Spender'].map((f) => h('option', { value: f }, f || '(ohne Markierung)')));
  const reason = h('input', { class: 'grow', placeholder: 'Grund für Bann oder Kick' });
  const length = h('select', {}, [['60', '1 Stunde'], ['1440', '1 Tag'], ['10080', '7 Tage'], ['43200', '30 Tage'], ['', 'dauerhaft']].map(([v, l]) => h('option', { value: v }, l)));
  const out = h('div', { class: 'console-out' });
  fill(dlg, 
    h('div', { class: 'row' }, h('h2', { style: 'margin:0' }, p.name || p.steam_id), d.online.length ? h('span', { class: 'badge ok' }, `online: ${d.online.join(', ')}`) : null,
      d.banned ? h('span', { class: 'badge bad' }, 'gebannt') : null, h('span', { class: 'grow' }), h('button', { class: 'ghost', onclick: () => dlg.close() }, 'Schließen')),
    h('div', { class: 'hint mono' }, `SteamID ${p.steam_id} · ARK-ID ${p.player_id || '–'} · Charakter ${p.character_name || '–'} · erstmals ${fmt(p.first_seen)} · zuletzt ${fmt(p.last_seen)} (${p.last_map || '–'}) · ${p.sessions} Sitzungen · ${dur(p.play_seconds)}`),
    d.names.length > 1 ? h('div', { class: 'hint' }, 'Namen: ', d.names.map((n) => n.name).join(', ')) : null,
    can('chat') && d.online.length ? h('div', { class: 'row' }, msg, h('button', { onclick: safe(async () => { out.textContent = resultText(await api('POST', `/api/players/${p.steam_id}/message`, { text: msg.value })); msg.value = ''; }) }, 'Senden')) : null,
    (can('kick') || can('ban')) ? h('div', { class: 'row' }, reason,
      can('kick') && d.online.length ? h('button', { class: 'ghost', onclick: safe(async () => { out.textContent = resultText(await api('POST', `/api/players/${p.steam_id}/kick`, { reason: reason.value })); }) }, 'Kicken') : null,
      can('ban') ? [length, h('button', { class: 'danger', onclick: safe(async () => {
        if (!confirm(`${p.name || p.steam_id} auf allen Karten bannen?`)) return;
        await api('POST', '/api/bans', { steamId: p.steam_id, reason: reason.value, minutes: length.value || null, name: p.name });
        toast('Gebannt'); openPlayer(p.steam_id);
      }) }, 'Bannen')] : null) : null,
    out,
    h('div', { class: 'cols' },
      h('div', {}, h('h3', {}, 'Chat und Ereignisse'), h('div', { class: 'scroll' }, d.events.length ? d.events.map((e) => evLine(e, true)) : h('div', { class: 'muted' }, 'keine'))),
      h('div', {},
        h('h3', {}, 'Sitzungen'), h('div', { class: 'scroll', style: 'max-height:160px' }, h('table', {}, d.sessions.map((s) => h('tr', {}, h('td', {}, s.map), h('td', {}, fmt(s.start_ts)), h('td', {}, s.end_ts ? dur((s.end_ts - s.start_ts) / 1000) : 'online'), h('td', { class: 'muted' }, s.end_reason || ''))))),
        h('h3', {}, 'Banns'), d.bans.length ? h('table', {}, d.bans.map((b) => banRow(b, () => openPlayer(p.steam_id)))) : h('div', { class: 'muted' }, 'keine'),
        can('notes') ? [h('h3', {}, 'Notizen'), h('div', { class: 'row' }, note, flag, h('button', { onclick: safe(async () => { await api('POST', `/api/players/${p.steam_id}/notes`, { text: note.value, flag: flag.value || null }); openPlayer(p.steam_id); }) }, 'Hinzufügen')),
          d.notes.map((n) => h('div', { class: 'ev' }, h('time', {}, fmt(n.ts)), n.flag ? h('span', { class: 'badge' }, n.flag) : null, ' ', h('b', {}, n.author), ': ', n.text, ' ',
            h('a', { title: 'löschen', onclick: safe(async () => { if (!confirm('Notiz löschen?')) return; await api('DELETE', `/api/notes/${n.id}`); openPlayer(p.steam_id); }) }, '×')))] : null)));
  if (!dlg.open) dlg.showModal();
});

// --- activity --------------------------------------------------------------------------------------------------
function activity(main) {

// --- live updates --------------------------------------------------------------------------------------------------
function connectStream() {
  if (S.es) S.es.close();
  const es = new EventSource('/api/stream');
  S.es = es;
  es.addEventListener('event', (msg) => {
    const e = JSON.parse(msg.data);
    if (e.map) { const f = (S.feeds[e.map] = S.feeds[e.map] || []); f.push(e); if (f.length > 300) f.splice(0, f.length - 300); }
    if (S.view === 'dashboard' && e.map) {
      const feed = document.querySelector(`.card[data-map="${CSS.escape(e.map)}"] .feed`);
      if (feed) { const atEnd = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 30; feed.append(evLine(e)); if (atEnd) feed.scrollTop = feed.scrollHeight; }
    }
    if (S.view === 'activity' && S.activityList && S.activityFilter().live) {
      const f = S.activityFilter();
      if ((!f.map || f.map === e.map) && (!f.types || f.types.split(',').includes(e.type)) && (!f.q || `${e.text} ${e.name}`.toLowerCase().includes(f.q.toLowerCase()))) S.activityList.prepend(evLine(e, true));
    }
  });
  const refresh = () => { clearTimeout(S.mt); S.mt = setTimeout(safe(async () => { S.maps = await api('GET', '/api/maps'); if (S.view === 'dashboard') refreshCards(); }), 300); };
  es.addEventListener('player', refresh);
  es.addEventListener('status', refresh);
}
function refreshCards() {
  for (const m of S.maps) {
    const card = document.querySelector(`.card[data-map="${CSS.escape(m.name)}"]`);
    if (!card) continue;
    card.querySelector('.head').replaceWith(cardHead(m));
    card.querySelector('.players').replaceWith(cardPlayers(m));
  }
}

async function boot() {
  try { S.me = await api('GET', '/api/me'); } catch { S.me = null; render(); return; }
  S.meta = await api('GET', '/api/meta');
  S.maps = await api('GET', '/api/maps');
  const recent = await api('GET', '/api/events?limit=600');
  S.feeds = {};
  for (const e of recent.reverse()) if (e.map) (S.feeds[e.map] = S.feeds[e.map] || []).push(e);
  const v = location.hash.slice(1);
  if (VIEWS.some(([id, , p]) => id === v && can(p))) S.view = v;
  render();
  connectStream();
}
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (S.me && v !== S.view && VIEWS.some(([id, , p]) => id === v && can(p))) { S.view = v; render(); }
});
boot();
</script>
